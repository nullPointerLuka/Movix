<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Movix</title>
  <link rel="icon" href="/COMPONENTES/BD/sprt/favicon_io/favicon-32x32.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="Style.css"/>
</head>
<body>


<nav class="nt-navbar fixed-top">
  <div class="d-flex justify-content-between align-items-center px-4 py-3 mx-auto" style="max-width:1440px;">

    <div class="d-flex align-items-center gap-5">
      <a class="nt-brand" href="#">Movix</a>
      <div class="d-none d-md-flex align-items-center gap-4">
        <a class="nt-nav-link active" href="/Movix/">Home</a>
        <a class="nt-nav-link" href="#"></a>
        <a class="nt-nav-link" href="#"></a>
        <a class="nt-nav-link" href="#"></a>
      </div>
    </div>

    <div class="d-flex align-items-center gap-3">


      <div class="nt-search-wrap d-none d-lg-block" style="width:800px;">
        <span class="material-symbols-outlined">search</span>
        <input  id="searchInputDetails" class="nt-search" placeholder="Search films..." type="text"/>


<div id="searchResults" class="nt-search-results"></div>
           </div>
      <div class="d-flex gap-2">
        <button class="nt-icon-btn material-symbols-outlined">notifications</button>
        <button class="nt-icon-btn material-symbols-outlined">account_circle</button>
      </div>
    </div>

  </div>
</nav>

<main>

  <!-- Hero -->
  <section class="nt-hero">
    <div class="nt-hero-bg"></div>
    <div class="nt-hero-gradient"></div>
    <div class="nt-hero-content">
      <div class="d-flex gap-2 mb-3">
        <div class="nt-hero-badges d-flex gap-2 mb-3"></div>
      </div>
      <h1  id="titulo" class="nt-hero-title mb-3"></h1>
      <div class="nt-hero-meta">
        <span class="rating-val d-flex align-items-center gap-1">
          <span class="material-symbols-outlined fill-icon" style="font-size:1rem;">star</span> 9.2
        </span>
        <span></span>
        <span></span>
        <span class="nt-rating-pill"></span>
      </div>
    </div>
  </section>

  <!-- Contenido -->
  <section class="nt-content-section">
    <div class="row g-5 mx-auto" style="max-width:1440px;">

      <!-- Poster -->
      <aside class="col-12 col-lg-4">
        <div class="nt-poster-card">

      
          <div class="nt-poster-img-wrap">
            <img alt="Imagen Poster" />
            <div class="nt-poster-ring"></div>
          </div>

      
          <div>
            <p class="nt-stat-label mb-2">Genero</p>
            <div class="d-flex flex-wrap gap-2">
              <span class="nt-genre-chip"></span>
            </div>
          </div>

          <!-- Estadisticas -->
          <div class="d-flex justify-content-between align-items-center py-3" style="border-top:1px solid rgba(72,72,71,.1); border-bottom:1px solid rgba(72,72,71,.1);">
            <div>
              <p class="nt-stat-label mb-1">Vistas</p>
              <span class="nt-stat-value"></span>
            </div>  
            <div class="text-end">
              <p class="nt-stat-label mb-1">Rating</p>
              <div class="nt-stars">
                <span class="material-symbols-outlined ">star</span>

              </div>
            </div>
          </div>

          <!-- CTA -->
          <button class="nt-btn-cta">
            <span class="material-symbols-outlined fill-icon">play_arrow</span>
            Ver Trailer
          </button>

        </div>
      </aside>

      <!-- Sipnosis y cast  -->
      <div class="col-12 col-lg-8 d-flex flex-column gap-5">

       
        <div>
          <h2 class="nt-section-heading mb-4">Sipnosis</h2>
          <p class="nt-synopsis">
           
          </p>
        </div>

        <div>
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h2 class="nt-section-heading">Reparto</h2>
            <a class="nt-footer-link" style="color:var(--nt-primary); font-size:.72rem;" href="#">Ver Creditos</a>
          </div>
          <div class="row row-cols-2 row-cols-sm-4 g-3">

            <!-- Actores -->
            <div class="col">
              <div class="nt-cast-card">
                <div class="nt-cast-img-wrap mb-2">
                  <img alt="Julian Vance" src=""/>
                  <div class="nt-cast-overlay"></div>
                </div>
                <p class="nt-cast-name mb-0"></p>
                <p class="nt-cast-role"></p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Comentarios -->
  <section class="nt-comments-section">
    <div class="mx-auto" style="max-width:1440px;">
      <div style="max-width:56rem;">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-5">
          <h2 class="nt-comments-title">Opiniones del público</h2>
          <span id="totalComentarios" class="nt-comments-count"></span>
        </div>

        <!-- Input area -->
        <div class="nt-comment-box d-flex gap-4 mb-5">
          <div class="nt-avatar">LL</div>
          <div class="flex-grow-1 d-flex flex-column gap-3">
            <textarea class="nt-textarea" placeholder="Añade un comentario"></textarea>
            <div class="d-flex justify-content-end">
              <button class="nt-btn-post">Comentar</button>
            </div>
          </div>
        </div>

        <!-- Comentarios -->
        <div class="d-flex flex-column gap-5">
          <div class="d-flex gap-4">
            <div class="nt-review-avatar-wrap">
               </div>
            <div class="d-flex flex-column gap-2">
              <div class="d-flex align-items-center gap-3">
                <span class="nt-reviewer-name"></span>
                <span class="nt-review-time"></span>
              </div>
              <div class="nt-stars mb-1">
                <span class="material-symbols-outlined fill-icon">star</span>
                <span class="material-symbols-outlined">star</span>
              </div>
              <p class="nt-review-text mb-0"></p>
              <div class="d-flex gap-4 mt-1">
                <!--Futura opcion-->
                <button class="nt-reaction-btn">
                  <span class="material-symbols-outlined">thumb_up</span> 341
                </button>
                <!--Futura opcion-->
                <button class="nt-reaction-btn">
                  <span class="material-symbols-outlined">reply</span> Reply
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>

</main>


<footer class="nt-footer">
  <div class="container-xxl px-4 mx-auto" style="max-width:1440px;">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-4">


      <div class="d-flex flex-column align-items-center align-items-md-start gap-2">
        <span class="nt-footer-brand">MOVIX</span>
        <p class="nt-footer-copy mb-0 text-center text-md-start" style="max-width:20rem;">
        </p>
      </div>

      <!-- Links -->
      <div class="d-flex gap-5">
        <div class="d-flex flex-column gap-3">
          <span class="nt-footer-col-title">Explorar</span>
          <a class="nt-footer-link" href="#">Privacidad</a>
          <a class="nt-footer-link" href="#">Terminos y condiciones</a>
        </div>
        <div class="d-flex flex-column gap-3">
          <span class="nt-footer-col-title">Soporte</span>
          <a class="nt-footer-link" href="#">Contacto</a>
        </div>
      </div>


      <div class="d-flex gap-2">
        <button class="nt-footer-social-btn material-symbols-outlined">public</button>
        <button class="nt-footer-social-btn material-symbols-outlined">share</button>
        <button class="nt-footer-social-btn material-symbols-outlined">favorite</button>
      </div>

    </div>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/search.js"></script>
<script src="detalle.js"></script>
</body>
</html>
